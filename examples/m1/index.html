<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICE3 Engine M1</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div>
        <strong>ICE3 Engine</strong>
        <span>M1 tiled asset</span>
      </div>
      <output data-role="status">正在加载资产</output>
      <output
        class="tileset-progress"
        data-role="tileset-progress"
        data-state="loading"
        aria-live="polite"
      >驻留 0 · 可见 0 · 加载中 0 · 总计 0</output>
      <button id="dispose" type="button" disabled>释放资产</button>
    </header>
    <main id="stage" data-role="stage" aria-busy="true">
      <section
        class="loading"
        data-role="loading"
        data-state="loading"
        role="status"
        aria-live="polite"
        aria-label="工业模型加载状态"
      >
        <div class="loading__content">
          <span class="loading__eyebrow">ICE3 / SCENE PIPELINE</span>
          <div class="loading__mark" aria-hidden="true">
            <span></span>
          </div>
          <h1 data-role="loading-title">正在构建工业场景</h1>
          <p class="loading__detail" data-role="loading-detail">读取模型数据</p>
          <div class="loading__meter" aria-hidden="true"><span></span></div>
          <span class="loading__hint">大型模型可能需要数秒</span>
        </div>
      </section>
      <aside
        class="controls-hint"
        data-role="controls-hint"
        data-state="hidden"
        aria-hidden="true"
        aria-label="视角操作提示"
      >
        <div class="controls-hint__header">
          <span class="controls-hint__signal" aria-hidden="true"></span>
          <span>操作提示</span>
        </div>
        <dl class="controls-hint__desktop">
          <div>
            <dt>
              <kbd>WASD</kbd>
              <span>或</span>
              <kbd>方向键</kbd>
            </dt>
            <dd>移动视图</dd>
          </div>
          <div>
            <dt><span class="controls-hint__gesture">鼠标拖拽</span></dt>
            <dd>旋转视角</dd>
          </div>
          <div>
            <dt><span class="controls-hint__gesture">滚轮</span></dt>
            <dd>缩放</dd>
          </div>
        </dl>
        <dl class="controls-hint__touch">
          <div>
            <dt>单指拖动</dt>
            <dd>旋转视角</dd>
          </div>
          <div>
            <dt>双指捏合</dt>
            <dd>缩放</dd>
          </div>
        </dl>
      </aside>
      <aside
        class="selection-info"
        data-role="selection-info"
        data-state="hidden"
        aria-hidden="true"
        aria-live="polite"
        aria-labelledby="selection-name"
      >
        <div class="selection-info__header">
          <span>当前设备</span>
          <span class="selection-info__badge">演示信息</span>
        </div>
        <h2 id="selection-name" data-role="selection-name"></h2>
        <dl class="selection-info__details">
          <div>
            <dt>设备编号</dt>
            <dd data-role="selection-code"></dd>
          </div>
          <div>
            <dt>运行状态</dt>
            <dd data-role="selection-status"></dd>
          </div>
          <div>
            <dt>设备类型</dt>
            <dd data-role="selection-type"></dd>
          </div>
          <div>
            <dt>所属区域</dt>
            <dd data-role="selection-area"></dd>
          </div>
        </dl>
      </aside>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
